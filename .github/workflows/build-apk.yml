name: Build APK

# Builds the installable debug APK on GitHub's servers (which have the Android SDK and
# full network access) and publishes it as a downloadable artifact on every run.
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-link-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish the APK to a dedicated orphan branch so it can be retrieved via git
      # (some environments cannot reach the artifact download host directly).
      - name: Publish APK to apk-output branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/family-link-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-output
          git reset --hard
          mkdir -p apk
          cp /tmp/family-link-debug.apk apk/family-link-debug.apk
          echo "Prebuilt debug APK for commit ${GITHUB_SHA}." > apk/README.txt
          git add apk/family-link-debug.apk apk/README.txt
          git commit -m "APK build for ${GITHUB_SHA}"
          git push -f origin apk-output
